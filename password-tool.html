<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;800&display=swap"><link rel="stylesheet" href="style.css"><title>أداة بصمة كلمة المرور</title></head><body>
<div id="top"></div><main class="wrap hero center"><h1>إنشاء بصمة كلمة المرور</h1><p>اكتب كلمة المرور (يفضَّل 10 أحرف فأكثر)، ثم انسخ السطر الناتج إلى <b>accessHashes</b> في ملف site.config.json.</p>
<form class="form" id="f" style="text-align:right"><div><label for="pw">كلمة المرور الجديدة</label><input id="pw" dir="ltr" style="text-align:right" autocomplete="off"></div><button type="submit">إنشاء البصمة</button></form>
<pre id="out" dir="ltr" style="background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;max-width:560px;margin:18px auto;white-space:pre-wrap;word-break:break-all;text-align:left"></pre></main><footer id="foot"></footer>
<script src="site.js"></script><script>
SITE.shell('login');
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var p=document.getElementById('pw').value.trim();if(!p)return;
 SITE.ready.then(function(){return SITE.hash(p)}).then(function(h){document.getElementById('out').textContent='"accessHashes": ["'+h+'"]'})};
</script></body></html>
