<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;800&display=swap"><link rel="stylesheet" href="style.css"><title>الدخول إلى الاختبارات</title></head><body>
<div id="top"></div><main class="wrap hero center"><h1>الدخول إلى الاختبارات</h1><p>اكتب كلمة المرور التي زوّدك بها المشرف.</p>
<form class="form" id="f" novalidate style="text-align:right"><div><label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" dir="ltr" style="text-align:right"><div class="err" id="er"></div></div><button type="submit" id="go">دخول</button></form>
<p><a href="index.html">← الصفحة الرئيسية</a></p></main><footer id="foot"></footer>
<script src="site.js"></script><script>
SITE.shell('login');
var H=[];SITE.ready.then(function(){H=SITE.cfg().accessHashes||[]});
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var er=document.getElementById('er'),b=document.getElementById('go');
 SITE.ready.then(function(){return SITE.hash(document.getElementById('pw').value)}).then(function(h){var H=SITE.cfg().accessHashes||[];
  if(!H.length||H.indexOf(h)>-1){SITE.login(h);var n=SITE.q('next')||'exams.html';if(!/^[\w.\-]+(\?[\w=&%.\-]*)?$/.test(n)||/^(https?|javascript)/i.test(n))n='exams.html';location.href=n}
  else{er.textContent='كلمة المرور غير صحيحة';document.getElementById('pw').classList.add('bad')}})};
</script></body></html>
