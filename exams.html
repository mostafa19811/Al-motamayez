<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f3d2e"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;800&display=swap"><link rel="stylesheet" href="style.css"><title>الاختبارات</title></head><body>
<div id="top"></div><main class="wrap hero"><h1>الاختبارات</h1><p class="hi" id="hi"></p><div class="chips" id="chips"></div><div id="list"></div></main><footer id="foot"></footer>
<script src="site.js"></script><script>
SITE.shell('exams');var e=SITE.esc,B=SITE.BR,flt='all',L=[];
var s=SITE.get();if(s)document.getElementById('hi').innerHTML=e(s.name)+' — '+e(s.gradeLabel)+' · <a href="register.html">تعديل بياناتي</a>';
function draw(){var d=document.getElementById('chips');d.innerHTML=[['all','الكل'],['quant','كمي'],['verbal','لفظي']].map(function(c){return '<button class="chip'+(flt===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join('');
 var out='';['quant','verbal'].forEach(function(b){if(flt!=='all'&&flt!==b)return;var xs=L.filter(function(x){return x.branch===b});if(!xs.length)return;out+='<section class="grp"><h2>'+B[b]+'</h2>';
  var sk=[];xs.forEach(function(x){var k=x.skill||'مهارات متنوعة';if(sk.indexOf(k)<0)sk.push(k)});
  sk.forEach(function(k){out+='<h3>'+e(k)+'</h3><ul class="list">'+xs.filter(function(x){return (x.skill||'مهارات متنوعة')===k}).sort(function(a,b){return a.exam-b.exam}).map(function(x){
   return '<li><a href="register.html?e='+encodeURIComponent(x.file)+'"><span class="num">'+e(x.exam)+'</span><div><b>'+e(x.title)+'</b><small>'+(x.skills&&x.skills.length>1?e(x.skills.join(' · '))+' — ':'')+e(x.count)+' سؤالًا · '+e(x.minutes)+' دقيقة</small></div></a></li>'}).join('')+'</ul>'});out+='</section>'});
 document.getElementById('list').innerHTML=out||'<p>لا توجد اختبارات منشورة بعد.</p>'}
document.getElementById('chips').onclick=function(ev){var b=ev.target.closest('[data-f]');if(b){flt=b.dataset.f;draw()}};
fetch('data/exams/index.json').then(function(r){return r.json()}).catch(function(){return[]}).then(function(l){L=Array.isArray(l)?l:(l.exams||[]);draw()});
</script></body></html>
